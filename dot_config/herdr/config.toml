# herdr configuration
# Full list of options / defaults: `herdr --default-config`
# Kept intentionally minimal — v0.7 series is still under active development.
# デフォルト値は書かない方針（v0.7 系の schema 変更に対する追随コストを最小化）。

# remote (ssh) での初回起動時に onboarding 画面が出るのを抑止（設定選択済み）。
# 未指定でも onboarding 扱いになるため false を明示する。
onboarding = false

[theme]
# Ghostty は暗いテーマ固定のため auto_switch は使わず、ダークテーマに固定する。
name = "catppuccin"

# サイドバーのフォーカス行・Navigate カーソル行が背景に埋もれるため catppuccin の surface1 で強調する。
[theme.custom]
active_row_bg = "#45475a"
selection_bg = "#45475a"
# ダークテーマの区切り線が背景に埋もれるため catppuccin の overlay0 で見えるようにする。
surface_dim = "#6c7086"

[keys]
# C-q は keybinds.zsh の `stty -ixon` で XON/XOFF から解放済み。
prefix = "ctrl+q"

# ペイン移動 prefix 不要
focus_pane_left = "ctrl+left"
focus_pane_down = "ctrl+down"
focus_pane_up = "ctrl+up"
focus_pane_right = "ctrl+right"

# tab 移動 prefix 不要
previous_tab = "shift+left"
next_tab = "shift+right"

# workspace 操作。Ghostty から cmd+shift+t → \x11t が注入される（cmd+t は Ghostty new_tab に返却）。
# close は herdr デフォルト close_workspace = prefix+shift+d のまま（Ghostty cmd+w → \x11D）。
new_workspace = "prefix+t"

# workspace 巡回。Claude Code の shift+tab モード切替は不使用のため専有してよい。
# Ghostty から cmd+shift+n → \x11N / cmd+shift+p → \x11P が注入される。
next_workspace = ["shift+tab", "prefix+shift+n"]
previous_workspace = "prefix+shift+p"

# サイドバーの並びで次 / 前の agent へ移動（Ghostty cmd+n → \x11n / cmd+p → \x11p）。
# 接続中の machine を横断できるのは組み込み action だけ（shell command は実行先 server の
# agent しか見えず、client の選択 machine も切り替えられない）。working の agent にも止まる。
next_agent = "prefix+n"
previous_agent = "prefix+p"

# built-in default の譲り渡し: 下の [[keys.command]] が素文字 chord（prefix+e / prefix+g）
# を使うため、default binding と衝突するものを shift 付きへ退避する。
# edit_scrollback: default prefix+e → emacs 起動（prefix+e）に譲る
edit_scrollback = "prefix+shift+s"
# goto: default prefix+g → lazygit 起動（prefix+g）に譲る
goto = "prefix+shift+o"
# rename_pane: default prefix+shift+p → previous_workspace（prefix+shift+p）に譲る
rename_pane = "prefix+shift+m"

# NOTE: 以下 3 つは popup type で使う。key は素文字 chord（prefix+g / prefix+f / prefix+e）で、
# 衝突する edit_scrollback / goto は上で shift 付きへ退避してある。
# width / height は popup 専用オプション（invalid な keybind 設定は有効な keybind ごと
# 破棄される — upstream issue #747）。pane type に変える場合は必ず削除する。

# lazygit（Ghostty cmd+g → \x11g）
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# fzf ファイルピッカー（Ghostty cmd+f → \x11f）
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/file-picker.sh"
width = "80%"
height = "80%"

# emacs（実行元 pane の repo ルートで emacs -nw。Ghostty cmd+e → \x11e）
# クリップボードに repo 内ファイルのパスがあればそれを開く（path:line 対応）
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "~/.config/herdr/emacs-popup.sh"
width = "90%"
height = "90%"

# issue / CL（PR・MR）ピッカー。起動元 pane の repo の open な一覧から選び、URL を貼る
# （Ghostty cmd+shift+i → \x11I / cmd+shift+c → \x11C）。gh / glab は origin の host で選ぶ
[[keys.command]]
key = "prefix+shift+i"
type = "popup"
command = "~/.config/herdr/issue-cl-picker.sh issue"
width = "90%"
height = "80%"

[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "~/.config/herdr/issue-cl-picker.sh cl"
width = "90%"
height = "80%"

# Claude Code session の fork（Ghostty cmd+shift+f → \x11F）
# フォーカス中 pane の session を `--fork-session` で複製し、右 pane で開く。
# Claude の無い pane では通知だけ出す。
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "~/.config/herdr/fork-claude.sh"

# レイアウト
# 現 pane を起点に split を積んで組む。既存 pane はそのまま残す（並び替え相当）。
[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "~/.config/herdr/layouts/4col-lazygit.sh"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "~/.config/herdr/layouts/emacs-dev.sh"

# レイアウト選択メニュー (Ghostty cmd+i → `\x11i`)
# 数字キーで即決、fzf incremental search も併用可。項目の定義は layout-menu.sh 側にある。
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "~/.config/herdr/layout-menu.sh"
width = "50%"
height = "40%"

[ui]
# Show detected agent labels in pane borders.
show_agent_labels_on_pane_borders = true
# サイドバーで「対応が要るか」を見分ける。状態を色ではなく形の違う記号で出し、
# 注意が要る順（blocked が先頭）に並べる。
status_indicators = "symbols"
agent_panel_sort = "priority"
# 2 行目のタスク名（Claude Code の terminal title）が読める幅（既定 26 / 最大 36）。
sidebar_width = 36
sidebar_max_width = 48

# Claude の agent 行: 1 行目に状態と居場所（machine は herdr 既定の行から引き継ぐ）、2 行目に何のタスクか。
# terminal_title_stripped は Claude Code の session 名（terminal title）から状態記号を除いたもの。
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "state_text", "machine", "workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.toast]
# herdr 標準の通知は出さない。文面が「<agent> finished / <workspace>」固定で、押しても
# terminal を前面に出すだけのため、plugin（agent-notify/）が代わりに通知を出す。
# 接続先 machine の agent は Hammerspoon が agent-notify/poll-machines.sh を定期起動して通知する。
delivery = "off"

[experimental]
# macOS + CJK IME: swap to an ASCII-capable input source while prefix mode is
# active so prefix chords still register when the IME is on.
switch_ascii_input_source_in_prefix = true

# Expose the focused pane's cursor to the outer terminal so the IME candidate
# window keeps tracking the cursor inside agent TUIs (Claude Code, Codex).
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]

# After changing this file, either restart herdr or run:
#   herdr server reload-config
#
# Agent integrations are managed separately (not via this file):
#   herdr integration install claude
#   herdr integration status
